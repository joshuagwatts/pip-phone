name: Ship

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --omit=dev
      - run: npx cap sync android
      - name: Stamp Android version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, os, re
          pkg = json.loads(Path("package.json").read_text())
          name = str(pkg.get("version") or "0.1.5")
          code = max(22, int(os.environ.get("GITHUB_RUN_NUMBER") or "22"))
          p = Path("android/app/build.gradle")
          t = p.read_text()
          t = re.sub(r"versionCode \d+", f"versionCode {code}", t)
          t = re.sub(r'versionName "[^"]+"', f'versionName "{name}"', t)
          p.write_text(t)
          print(f"Android {name} ({code})")
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Name the file Pip.apk
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Pip.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Pip-apk
          path: Pip.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Pip-windows
          path: dist-desktop/Pip-Windows.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx electron-builder --mac dmg --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Pip-mac
          path: dist-desktop/Pip-Mac.dmg
          if-no-files-found: error

  release:
    needs: [android, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Flatten downloads
        run: |
          mv Pip-apk/Pip.apk Pip.apk
          mv Pip-windows/Pip-Windows.exe Pip-Windows.exe
          mv Pip-mac/Pip-Mac.dmg Pip-Mac.dmg
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.6
          name: Pip v0.1.6
          body: |
            **Phone Pip v0.1.6** — cloud brains + desktop GPU pairing.

            - **Grok / xAI** — DATA → LEAKY → pin GROK → paste XAI key → PROBE GROK
            - **Cloud router** — Groq, OpenRouter, Cerebras, Mistral, Gemini wired (keys actually used now)
            - **Desktop GPU** — pair to desktop Pip on same Wi‑Fi; COMM uses PC Ollama
            - **Output cleanup** — less weird code/json spam from on-device Qwen
            - **Biometric lock** — optional gate before keys/pairing (when sensor available)

            **Install**
            - **Android** — Pip.apk. Install over the previous build. KIT stays.
            - **Windows** — Pip-Windows.exe
            - **Mac** — Pip-Mac.dmg
            - **Desktop Pip** — enable Phone LAN in DATA, set password, restart, pair from phone DATA tab
          files: |
            Pip.apk
            Pip-Windows.exe
            Pip-Mac.dmg
          fail_on_unmatched_files: true
