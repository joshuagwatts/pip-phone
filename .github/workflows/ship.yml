name: Ship

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --omit=dev
      - name: JS module check
        run: |
          node --check www/boot.js
          node --check www/brain.js
          node --check www/app.js
          node --check www/cloud.js
          node --check www/codefs.js
          node --check www/codeagent.js
          node --check www/code.js
          node --check www/morning.js
          node --check www/web.js
          node --check www/keysync.js
          node --check www/wx.js
          node --input-type=module -e "import './www/brain.js'; console.log('brain ok')"
      - run: npx cap sync android
      - name: Ensure CapacitorHttp native plugin
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("android/app/src/main/assets/capacitor.plugins.json")
          data = json.loads(p.read_text())
          hit = {"pkg": "@capacitor/core", "classpath": "com.getcapacitor.plugin.CapacitorHttp"}
          if not any(x.get("classpath") == hit["classpath"] for x in data):
              data.append(hit)
              p.write_text(json.dumps(data, indent="\t") + "\n")
              print("added CapacitorHttp")
          else:
              print("CapacitorHttp already registered")
          PY
      - name: Stamp Android version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, os, re
          pkg = json.loads(Path("package.json").read_text())
          name = str(pkg.get("version") or "0.1.5")
          code = max(22, int(os.environ.get("GITHUB_RUN_NUMBER") or "22"))
          p = Path("android/app/build.gradle")
          t = p.read_text()
          t = re.sub(r"versionCode \d+", f"versionCode {code}", t)
          t = re.sub(r'versionName "[^"]+"', f'versionName "{name}"', t)
          p.write_text(t)
          print(f"Android {name} ({code})")
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # v3 downloads cmdline-tools 12266719 → Google 404. v4 uses current tools.
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Check signing secrets
        run: |
          if [ -z "${{ secrets.PIP_KS_B64 }}" ]; then
            echo "::error::PIP_KS_B64 secret is missing — add the 4 PIP_KS_* secrets (repo Settings → Secrets and variables → Actions) before shipping."
            exit 1
          fi
      - name: Decode release keystore
        env:
          PIP_KS_B64: ${{ secrets.PIP_KS_B64 }}
        run: |
          echo "$PIP_KS_B64" | base64 -d > /tmp/pip-release.p12
          echo "PIP_KS_PATH=/tmp/pip-release.p12" >> $GITHUB_ENV
      - name: Build release APK
        working-directory: android
        env:
          PIP_KS_STORE_PW: ${{ secrets.PIP_KS_STORE_PW }}
          PIP_KS_KEY_ALIAS: ${{ secrets.PIP_KS_KEY_ALIAS }}
          PIP_KS_KEY_PW: ${{ secrets.PIP_KS_KEY_PW }}
        run: chmod +x gradlew && ./gradlew assembleRelease
      - name: Name the file Pip.apk
        run: cp android/app/build/outputs/apk/release/app-release.apk Pip.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Pip-apk
          path: Pip.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Pip-windows
          path: dist-desktop/Pip-Windows.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx electron-builder --mac dmg --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Pip-mac
          path: dist-desktop/Pip-Mac.dmg
          if-no-files-found: error

  release:
    needs: [android, windows, macos]
    runs-on: ubuntu-latest
    env:
      # Fine-grained PAT from the Holowatts GitHub org/user → Settings → Secrets → HOLOWATTS_GH_TOKEN
      # Without it, releases show as github-actions[bot]. With it, they show as Holowatts.
      GH_TOKEN: ${{ secrets.HOLOWATTS_GH_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Release gate
        id: gate
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "publish=false" >> $GITHUB_OUTPUT
          else
            echo "publish=true" >> $GITHUB_OUTPUT
          fi
      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.publish == 'true'
      - name: Flatten downloads
        if: steps.gate.outputs.publish == 'true'
        run: |
          mv Pip-apk/Pip.apk Pip.apk
          mv Pip-windows/Pip-Windows.exe Pip-Windows.exe
          mv Pip-mac/Pip-Mac.dmg Pip-Mac.dmg
      - uses: softprops/action-gh-release@v2
        if: steps.gate.outputs.publish == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.HOLOWATTS_GH_TOKEN || github.token }}
        with:
          tag_name: ${{ steps.gate.outputs.tag }}
          name: Pip ${{ steps.gate.outputs.tag }}
          body: |
            **Phone Pip v0.1.95** — Super Chat + chat-first UI.

            - SUPER CHAT: the chat is now multi-model. Five modes — single, compare, auto ("best for the situation"), frugal (tokenomics: cost estimates, session spend), and discuss (multi-LLM round-table debate with rebuttals). Pollinations works free with no key; OpenAI/Anthropic/Gemini/OpenRouter/Groq/Grok/Cerebras/DeepSeek/Mistral work with your keys in DATA.
            - CHAT-FIRST UI: chat is the home screen. OPP / TODAY / MEALS / WX / VIBE / KIT / MEMORY are now slide-over panels (tap the launcher, swipe away) instead of tabs.
            - FIXED: "Yo" no longer gets a random canned response (the matcher saw "yo" inside "you"). Greetings greet; errors speak plainly.

            No reinstall needed — installs right over v0.1.94.
          files: |
            Pip.apk
            Pip-Windows.exe
            Pip-Mac.dmg
          fail_on_unmatched_files: true
