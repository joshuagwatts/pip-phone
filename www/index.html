<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0f0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>PIP</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./style.css" />
  <link rel="icon" href="./icon-192.png" />
</head>
<body>
  <header class="stat">
    <span class="mark">PIP</span>
    <span class="chip" id="mode-chip">PHONE</span>
    <span class="spacer"></span>
    <button type="button" id="comm-tog">COMM</button>
  </header>
  <main id="view"></main>
  <div id="status"></div>
  <nav class="tabs" id="tabs">
    <button data-tab="opp" class="on">OPP</button>
    <button data-tab="vibe">VIBE</button>
    <button data-tab="kit">KIT</button>
    <button data-tab="data">DATA</button>
  </nav>
  <aside id="comm">
    <header class="stat">
      <span class="mark">COMM</span>
      <span class="spacer"></span>
      <button type="button" id="comm-close">CLOSE</button>
    </header>
    <div id="log"></div>
    <div class="composer">
      <textarea id="input" rows="2" placeholder="What's the actual thing."></textarea>
      <button type="button" id="send" class="primary">SEND</button>
    </div>
  </aside>
  <script type="module" src="./app.js"></script>
</body>
</html>
