<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0f0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PIP" />
  <title>PIP</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="./style.css" />
  <link rel="icon" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
</head>
<body>
  <header class="stat">
    <span class="mark">PIP</span>
    <span class="chip ver" id="mode-chip">SECURE</span>
    <button type="button" id="privacy-tog" class="privacy-chip on" title="SECURE: desktop GPU first, cloud as fallback. LEAKY: master brain — LIVE API keys upscale/downscale first, then desktop, then Qwen. Cloud replies are marked LEAKED.">SECURE</button>
    <span class="spacer"></span>
    <button type="button" id="comm-tog">CHAT</button>
  </header>
  <main id="view"></main>
  <div id="status"></div>
  <nav class="tabs" id="tabs">
    <button data-tab="opp" class="on">OPP</button>
    <button data-tab="today">TODAY</button>
    <button data-tab="meals">MEALS</button>
    <button data-tab="wx">WX</button>
    <button data-tab="vibe">VIBE</button>
    <button data-tab="kit">KIT</button>
    <button data-tab="data">DATA</button>
  </nav>
  <aside id="comm">
    <header class="stat">
      <span class="mark">CHAT</span>
      <span class="spacer"></span>
      <button type="button" id="comm-close">CLOSE</button>
    </header>
    <div id="brain-strip" class="brain-strip" aria-label="connected brains"></div>
    <div id="log"></div>
    <div class="composer">
      <textarea id="input" rows="2" placeholder="Pip is happy to help!"></textarea>
      <button type="button" id="lens-btn" title="Photo lens — rock / shingle / identify">LENS</button>
      <button type="button" id="send" class="primary">SEND</button>
    </div>
  </aside>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script type="module" src="./boot.js"></script>
</body>
</html>
