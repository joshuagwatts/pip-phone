<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0f0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PIP" />
  <title>PIP</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="./style.css" />
  <link rel="icon" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
</head>
<body>
  <header class="stat">
    <span class="mark">PIP</span>
    <button type="button" id="privacy-tog" class="privacy-chip on" title="SECURE: phone + desktop first · cloud only when you pick a brain. LEAKY: cloud keys speak as Pip.">SECURE</button>
    <span class="spacer"></span>
    <button type="button" id="panel-tog" title="Modules" aria-label="Open modules">▦ <span id="queue-badge" class="q-badge" hidden></span></button>
  </header>
  <section id="panel" aria-hidden="true">
    <div class="panel-scrim" id="panel-scrim"></div>
    <div class="panel-sheet" id="panel-sheet">
      <header class="panel-head">
        <span id="panel-title" class="panel-title">OPP</span>
        <span class="spacer"></span>
        <button type="button" id="panel-x" aria-label="Close panel">✕</button>
      </header>
      <div id="view"></div>
    </div>
  </section>
  <div id="status"></div>
  <div id="module-sheet" hidden>
    <button type="button" class="sheet-bg" id="module-sheet-bg" aria-label="Close modules"></button>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="Modules">
      <header class="sheet-head">
        <span class="sheet-title">MODULES</span>
        <span class="spacer"></span>
        <button type="button" id="module-sheet-x" aria-label="Close modules">✕</button>
      </header>
      <div class="sheet-grid" id="module-grid">
        <button type="button" data-panel="opp">OPP</button>
        <button type="button" data-panel="today">TODAY</button>
        <button type="button" data-panel="meals">MEALS</button>
        <button type="button" data-panel="wx">WX</button>
        <button type="button" data-panel="vibe">VIBE</button>
        <button type="button" data-panel="kit">KIT</button>
        <button type="button" data-panel="memory">MEMORY</button>
        <button type="button" data-panel="data">DATA <span id="queue-badge-data" class="q-badge" hidden></span></button>
      </div>
    </div>
  </div>
  <aside id="comm">
    <div id="log"></div>
    <div class="crew-bar" id="crew-bar" hidden>
      <span class="crew-msg" id="crew-msg">CREW</span>
      <button type="button" id="crew-cancel">CANCEL</button>
    </div>
    <div class="composer">
      <div id="chat-attach" class="chat-attach" hidden></div>
      <textarea id="input" rows="2" placeholder="Message Pip…"></textarea>
      <div class="composer-tools">
        <button type="button" id="agent-trig" class="agent-trig" aria-haspopup="dialog" aria-expanded="false" title="Who answers">
          <span class="agent-trig-dot" aria-hidden="true"></span>
          <span class="agent-trig-lab" id="agent-trig-lab">PIP</span>
          <span class="agent-trig-chev" aria-hidden="true"></span>
        </button>
        <button type="button" id="attach-btn" class="attach-btn" title="Attach photos — pick several, or tap again to add more" aria-label="Attach photos">
          <svg class="attach-ico" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M16.5 6v11.5a4 4 0 0 1-8 0V5a2.5 2.5 0 0 1 5 0v10.5a1 1 0 1 1-2 0V6h-1.5v9.5a2.5 2.5 0 0 0 5 0V5a4 4 0 0 0-8 0v12.5a5.5 5.5 0 0 0 11 0V6H16.5z"/>
          </svg>
        </button>
        <button type="button" id="lens-btn" title="Snap & identify — rock, roof, anything">LENS</button>
        <button type="button" id="send" class="primary">SEND</button>
      </div>
    </div>
    <div id="agent-sheet" class="agent-sheet" hidden>
      <button type="button" class="agent-sheet-bg" id="agent-sheet-bg" aria-label="Close agent picker"></button>
      <div class="agent-sheet-panel" role="dialog" aria-modal="true" aria-labelledby="agent-sheet-title">
        <header class="agent-sheet-head">
          <div>
            <div class="agent-sheet-kicker">ROUTE</div>
            <div class="agent-sheet-title" id="agent-sheet-title">WHO ANSWERS</div>
          </div>
          <button type="button" id="agent-sheet-close" class="agent-sheet-close">DONE</button>
        </header>
        <div class="agent-sheet-list" id="agent-sheet-list"></div>
      </div>
    </div>
  </aside>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script type="module" src="./boot.js"></script>
</body>
</html>
